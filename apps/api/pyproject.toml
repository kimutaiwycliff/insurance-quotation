[project]
name = "brokeros-api"
version = "0.1.0"
description = "Core API and background workers for the insurance agent & invoicing SaaS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard]>=0.142",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "psycopg[binary,pool]>=3.3",
  "procrastinate>=3.10",
  "redis>=6",
  "aioboto3>=13",
  "structlog>=25",
  "sentry-sdk>=2.40",
  "prometheus-client>=0.22",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7",
  "pytest-xdist>=3.8",
  "httpx>=0.28",
  "respx>=0.22",
  "hypothesis>=6.140",
  "time-machine>=3",
  "ruff>=0.14",
  "mypy>=2",
  "import-linter>=2.5",
  "pip-audit>=2.9",
  "boto3-stubs[s3]>=1.40",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "DTZ", "T20", "SIM",
  "RUF", "PT", "PL", "TRY", "PERF", "LOG", "G",
]
ignore = [
  "E501",    # the formatter owns code line length; long docstring/comment lines are allowed
  "PLR0913", # FastAPI dependencies legitimately take many params
  "TRY003",  # long messages in domain exceptions are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", "PLR2004", "S105", "S106",
  "PT012",   # transaction blocks inside pytest.raises are the point of RLS tests
  "TRY301", "PERF401",
]
"migrations/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "aioboto3.*", "aiobotocore.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs the Compose infrastructure (postgres, valkey, storage)",
  "committing: test commits real transactions and cleans up after itself",
  "sandbox: talks to a real provider sandbox; skipped unless credentials are present",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Calculation engine is pure (no I/O layers)"
type = "forbidden"
source_modules = ["app.calc"]
forbidden_modules = ["app.modules", "app.integrations", "app.workers", "sqlalchemy", "fastapi", "httpx"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.integrations"]

[[tool.importlinter.contracts]]
name = "Platform does not depend on feature modules"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Modules talk to each other only through service.py"
type = "independence"
modules = ["app.modules.*"]
ignore_imports = ["app.modules.** -> app.modules.*.service"]
