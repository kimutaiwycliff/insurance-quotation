# Local development stack. Every service the product needs runs here (ADR-0001).
# Usage: `make up` (or `docker compose up -d --build`). Copy .env.example to .env to override defaults.
# Defaults below are DEVELOPMENT-ONLY credentials.

name: brokeros

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  RELEASE: ${RELEASE:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-false}
  DATABASE_URL: postgresql+psycopg://app_user:${APP_USER_PASSWORD:-app_user_dev}@postgres:5432/${POSTGRES_DB:-app}
  VALKEY_URL: redis://valkey:6379/0
  S3_ENDPOINT_URL: http://storage:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devaccesskey}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-documents}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Tokens are issued by the auth service; the API fetches its JWKS over the internal network.
  AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3001}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-brokeros-api}
  AUTH_INTERNAL_AUDIENCE: ${AUTH_INTERNAL_AUDIENCE:-brokeros-internal}
  # Browsers reach storage on the host port; the API reaches it on the internal network.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  GOTENBERG_URL: http://gotenberg:3000
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@brokeros.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-BrokerOS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  SIGNING_SECRET: ${SIGNING_SECRET:-dev-only-signing-secret-0123456789abcdef}

x-auth-env: &auth-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  PORT: "3001"
  # Public URL of auth = the web app, which proxies /api/auth/* (same-origin cookies, links in emails).
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  AUTH_DATABASE_URL: postgres://auth_owner:${AUTH_OWNER_PASSWORD:-auth_owner_dev}@postgres:5432/${POSTGRES_DB:-app}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3001}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-brokeros-api}
  AUTH_INTERNAL_AUDIENCE: ${AUTH_INTERNAL_AUDIENCE:-brokeros-internal}
  API_INTERNAL_URL: http://api:8000
  EMAIL_FROM: ${EMAIL_FROM:-BrokerOS <no-reply@brokeros.local>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}

x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-app_owner_dev}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_dev}
      APP_SCANNER_PASSWORD: ${APP_SCANNER_PASSWORD:-app_scanner_dev}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD:-auth_owner_dev}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"  # non-standard host port avoids clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage (MinIO is archived; see ADR-0005).
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-devaccesskey}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
      RUSTFS_VOLUMES: /data
    volumes:
      - storagedata:/data
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    build: { <<: *api-build, target: api }
    command: ["python", "-m", "scripts.storage_init"]
    environment: *app-env
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # HTML -> PDF. Internal only; hardened against SSRF (SPEC_REVIEW §4.5).
  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    command:
      - gotenberg
      - --chromium-deny-private-ips=true
      - --chromium-disable-javascript=true
      # Only Gotenberg's own temp files may be loaded (templates inline everything as data: URIs).
      - --chromium-allow-list=^file:///tmp/.*
      - --webhook-deny-private-ips=true
      - --api-timeout=30s
      - --log-format=json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build: { <<: *api-build, target: api }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://app_owner:${APP_OWNER_PASSWORD:-app_owner_dev}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { <<: *api-build, target: api }
    environment:
      <<: *app-env
      # Trust X-Forwarded-For from the web proxy (only the web container and the host can reach this port).
      # In production set this to the ingress/proxy network instead.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      gotenberg: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Better Auth tables in schema "auth" (as auth_owner). One-shot, like `migrate`.
  auth-migrate:
    build: { context: ./apps/auth, target: runtime }
    command: ["node", "dist/migrate.js"]
    environment: *auth-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  auth:
    build: { context: ./apps/auth, target: runtime }
    environment: *auth-env
    ports:
      - "127.0.0.1:${AUTH_PORT:-3001}:3001"
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Next.js web app (BFF): the only thing browsers talk to, apart from presigned storage URLs.
  web:
    build: { context: ./apps/web, target: runtime }
    environment:
      AUTH_INTERNAL_URL: http://auth:3001
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
      auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build: { <<: *api-build, target: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "procrastinate", "--app=app.workers.app.app", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  valkeydata:
  storagedata:
